notifications:
  tip-payments-enabled: ${TIP_PAYMENT_EMAILS_ENABLED:false}

payments:
  enabled: ${PAYMENTS_ENABLED:false}
  test-user-ids: ${PAYMENTS_TEST_USER_IDS:}
  test-activation-code: ${PAYMENTS_TEST_ACTIVATION_CODE:}

features:
  tip-pools-enabled: ${FEATURE_TIP_POOLS_ENABLED:false}

frontend:
  base-url: ${FRONTEND_BASE_URL:`http://localhost:3000`}

micronaut:
  application:
    name: payment-service
  server:
    port: 8082
  security:
    enabled: true
    authentication: bearer
    intercept-url-map:
      - pattern: /api/status
        access: isAnonymous()
      - pattern: /health/**
        access: isAnonymous()
      - pattern: /payment-service/tips/**
        access: isAnonymous()
      - pattern: /payment-service/webhooks/stripe-direct
        access: isAnonymous()
      - pattern: /payment-service/webhooks/stripe-connect
        access: isAnonymous()
      - pattern: /payment-service/webhooks/stripe
        access: isAnonymous()
      - pattern: /**
        access: isAuthenticated()
    token:
      jwt:
        signatures:
          secret:
            validation:
              jws-algorithm: HS256
              secret: ${JWT_SECRET:local-dev-secret-key-please-change-me-1234567890}

pool:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}

internal:
  api-key: ${INTERNAL_API_KEY:local-internal-secret-change-me}

stripe:
  test-only: true
  demo-enabled: false
  connect-stripe-pricing-enabled: ${STRIPE_CONNECT_STRIPE_PRICING_ENABLED:false}
  connect-platform-fees-enabled: ${STRIPE_CONNECT_PLATFORM_FEES_ENABLED:false}
  manual-payout-approved-accounts: ${STRIPE_MANUAL_PAYOUT_APPROVED_ACCOUNTS:}
  manual-payouts-api-approved: ${STRIPE_MANUAL_PAYOUTS_API_APPROVED:false}
  manual-payout-setup-enabled: ${STRIPE_MANUAL_PAYOUT_SETUP_ENABLED:false}
  sandbox-payouts: ${STRIPE_SANDBOX_PAYOUTS:true}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  direct-webhook-secret: ${STRIPE_DIRECT_WEBHOOK_SECRET:}
  connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}
  # STRIPE_SUCCESS_URL can override this property through Micronaut environment binding.
  success-url: "${frontend.base-url}/pay/success?session_id={CHECKOUT_SESSION_ID}"
  cancel-url: ${STRIPE_CANCEL_URL:`http://localhost:3000/pay/cancelled`}
  fee-percent: ${STRIPE_FEE_PERCENT:3.15}
  fee-fixed-minor: ${STRIPE_FEE_FIXED_MINOR:25}

endpoints:
  health:
    enabled: true
    sensitive: false

datasources:
  default:
    url: ${DATASOURCES_DEFAULT_URL:`jdbc:postgresql://localhost:5432/gratilodb`}
    username: ${DATASOURCES_DEFAULT_USERNAME:postgres}
    password: ${DATASOURCES_DEFAULT_PASSWORD:dbpass}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    schema: payment_mgmt

liquibase:
  enabled: true
  datasources:
    default:
      enabled: true
      liquibase-schema: payment_mgmt
      change-log: classpath:db/changelog/changelog-master.xml
      database-change-log-table-name: payment_mgmt_changelog
      database-change-log-lock-table-name: payment_mgmt_changelog_lock

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        default_schema: payment_mgmt

gratilo:
  pool-tip-min-minor: ${GRATILO_POOL_TIP_MIN_MINOR:200}
  pool-tip-max-minor: ${GRATILO_POOL_TIP_MAX_MINOR:50000}
  platform-fee-percent: ${GRATILO_PLATFORM_FEE_PERCENT:5.00}
  # Gross VAT-inclusive fee for pricing versions 15–18; older snapshots keep their rules.
  platform-fee-fixed-minor: ${GRATILO_PLATFORM_FEE_FIXED_MINOR:45}
  # VAT is extracted from the gross fee for versions 15–18 and frozen per checkout.
  platform-fee-vat-percent: ${GRATILO_PLATFORM_FEE_VAT_PERCENT:19.00}
  # Remains off until refund commission policy and sandbox acceptance have been approved.
  new-pricing-enabled: ${GRATILO_NEW_PRICING_ENABLED:false}

  # D01/D02/D04 approval and actual Stripe accounting evidence required.
  full-fee-compensation-enabled: ${GRATILO_FULL_FEE_COMPENSATION_ENABLED:false}
