plugins {
    id 'io.micronaut.application'
}

group = rootProject.group
version = rootProject.version

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'io.micronaut:micronaut-http-validation'
    annotationProcessor 'io.micronaut.serde:micronaut-serde-processor'
    annotationProcessor 'io.micronaut.data:micronaut-data-processor'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    implementation 'io.micronaut:micronaut-http-server-netty'
    implementation 'io.micronaut.serde:micronaut-serde-jackson'
    implementation 'io.micronaut.validation:micronaut-validation'
    implementation 'io.micronaut.security:micronaut-security-jwt'
    implementation 'io.micronaut.email:micronaut-email-javamail'
    implementation 'io.micronaut.data:micronaut-data-hibernate-jpa'
    implementation 'io.micronaut.sql:micronaut-jdbc-hikari'
    implementation 'io.micronaut.liquibase:micronaut-liquibase'
    implementation 'io.micronaut:micronaut-management'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'

    runtimeOnly 'ch.qos.logback:logback-classic'
    runtimeOnly 'org.yaml:snakeyaml'
    runtimeOnly 'org.hibernate.orm:hibernate-core'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.eclipse.angus:angus-mail'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'io.micronaut:micronaut-http-client'
    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testCompileOnly 'org.projectlombok:lombok:1.18.32'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.gratilo.user.Application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

micronaut {
    runtime 'netty'
    testRuntime 'junit5'
    processing {
        incremental true
        annotations 'com.gratilo.user.*', 'io.micronaut.liquibase.*'
    }
}

tasks.register('registrationPostgresTest', Test) {
    description = 'Runs registration regression tests against an isolated local PostgreSQL instance.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/RegistrationIntegrationTest.class'
    // Java 21 containers may prohibit Mockito's dynamic self-attachment.
    // Use its supported premain agent from the actual resolved test classpath.
    jvmArgumentProviders.add({
        def agent = classpath.files.find { it.name.startsWith('mockito-core-') && it.name.endsWith('.jar') }
        if (agent == null) {
            throw new GradleException('Mockito test agent not found')
        }
        ['-javaagent:' + agent.absolutePath]
    } as org.gradle.process.CommandLineArgumentProvider)
    inputs.property('databaseUrl', providers.environmentVariable('REGISTRATION_TEST_DATABASE_URL').orElse(''))
    doFirst {
        if (!System.getenv('REGISTRATION_TEST_DATABASE_URL')) {
            throw new GradleException('Run via python3 deployment/scripts/test_registration_postgres.py')
        }
    }
}
