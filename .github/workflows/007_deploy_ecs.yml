name: Publish Gratilo images to ECR
'on':
  workflow_call:
    inputs:
      version_bump:
        type: string
        required: true
      previous_version:
        type: string
        required: true
      release_version:
        type: string
        required: true
      image_tag:
        type: string
        required: true
    outputs:
      frontend_image:
        value: ${{ jobs.publish.outputs.frontend_image }}
      user_service_image:
        value: ${{ jobs.publish.outputs.user_service_image }}
      payment_service_image:
        value: ${{ jobs.publish.outputs.payment_service_image }}
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EXPECTED_OIDC_ENVIRONMENT: release
      EXPECTED_OIDC_REF: ${{ github.ref }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      VERSION_BUMP: ${{ inputs.version_bump }}
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    outputs:
      frontend_image: ${{ steps.publish.outputs.frontend_image }}
      user_service_image: ${{ steps.publish.outputs.user_service_image }}
      payment_service_image: ${{ steps.publish.outputs.payment_service_image }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Validate production configuration
      env:
        AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        ENABLED: ${{ vars.ECR_PUBLISH_ENABLED }}
      run: |-
        [[ "$ENABLED" == true ]] || { echo "ECR_PUBLISH_ENABLED must be true" >&2; exit 1; }
        [[ "$AWS_REGION" == eu-central-1 && "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
        [[ "$AWS_DEPLOY_ROLE_ARN" == "arn:aws:iam::$AWS_ACCOUNT_ID:role/"* ]]
    - uses: actions/download-artifact@v4
      with:
        name: scanned-images-${{ inputs.image_tag }}
        path: ${{ runner.temp }}/gratilo-images
    - name: Diagnose production OIDC identity (public claims only)
      run: node deployment/scripts/oidc_claims.cjs
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: gratilo-publish-${{ github.run_id }}
        unset-current-credentials: true
    - name: Verify AWS account
      run: '[[ "$(aws sts get-caller-identity --query Account --output text)" == "$AWS_ACCOUNT_ID" ]]'
    - uses: aws-actions/amazon-ecr-login@v2
    - name: Publish both immutable image tags and create annotated Git tag last
      id: publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 deployment/scripts/semver_release.py release-publish
    - name: Report publication skipped after an earlier job error
      if: ${{ failure() && steps.publish.outcome == 'skipped' }}
      run: python3 deployment/scripts/semver_release.py not-started
