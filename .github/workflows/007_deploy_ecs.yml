name: Publish and deploy shared Gratilo ECS task
'on':
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    outputs:
      frontend_image: ${{ steps.publish.outputs.frontend_image }}
      user_service_image: ${{ steps.publish.outputs.user_service_image }}
      payment_service_image: ${{ steps.publish.outputs.payment_service_image }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Validate production configuration
      env:
        AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
      run: |-
        [[ "$AWS_REGION" == eu-central-1 && "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
        [[ "$AWS_DEPLOY_ROLE_ARN" == "arn:aws:iam::$AWS_ACCOUNT_ID:role/"* ]]
        [[ "$STRIPE_PUBLISHABLE_KEY" == pk_live_* ]] || { echo 'Set repository STRIPE_PUBLISHABLE_KEY to the live publishable key before production.' >&2; exit 1; }
    - uses: actions/download-artifact@v4
      with:
        name: scanned-images-${{ inputs.image_tag }}
        path: ${{ runner.temp }}/gratilo-images
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: gratilo-publish-${{ github.run_id }}
        unset-current-credentials: true
    - name: Verify AWS account
      run: '[[ "$(aws sts get-caller-identity --query Account --output text)" == "$AWS_ACCOUNT_ID" ]]'
    - uses: aws-actions/amazon-ecr-login@v2
    - name: Publish scanned artifacts and resolve digests
      id: publish
      run: |-
        set -euo pipefail
        registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
        for service in frontend user-service payment-service; do
          docker load -i "$RUNNER_TEMP/gratilo-images/$service.tar"
          image="$registry/gratilo/$service:$IMAGE_TAG"
          docker tag "gratilo/$service:$IMAGE_TAG" "$image"
          docker push "$image"
          digest=$(aws ecr describe-images --repository-name "gratilo/$service" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          output_name="${service//-/_}_image"
          echo "$output_name=$registry/gratilo/$service@$digest" >> "$GITHUB_OUTPUT"
          echo "$service: $IMAGE_TAG / $digest" >> "$GITHUB_STEP_SUMMARY"
        done
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_PAGER: ''
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      ECS_TASK_EXECUTION_ROLE_ARN: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
      ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
      ECS_DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT || '1' }}
      FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}
      USER_SERVICE_IMAGE: ${{ needs.publish.outputs.user_service_image }}
      PAYMENT_SERVICE_IMAGE: ${{ needs.publish.outputs.payment_service_image }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Validate required deployment configuration
      env:
        AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      run: |
        for name in AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN ECS_CLUSTER ECS_SERVICE ECS_TASK_FAMILY ECS_TASK_EXECUTION_ROLE_ARN ECS_TASK_ROLE_ARN; do
          [[ -n "${!name}" ]] || { echo "Missing production variable: $name" >&2; exit 1; }
        done
        [[ "$AWS_REGION" == eu-central-1 && "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
        [[ "$AWS_DEPLOY_ROLE_ARN" == "arn:aws:iam::$AWS_ACCOUNT_ID:role/"* ]]
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: gratilo-deploy-${{ github.run_id }}
        unset-current-credentials: true
    - name: Verify AWS account
      run: '[[ "$(aws sts get-caller-identity --query Account --output text)" == "$AWS_ACCOUNT_ID" ]]'
    - name: Register all three images, update service and verify rollout
      run: bash deployment/scripts/deploy_ecs.sh
    needs: publish
