name: Build and scan Gratilo images
'on':
  workflow_call:
    inputs:
      upload_artifacts:
        type: boolean
        default: false
    outputs:
      image_tag:
        value: ${{ jobs.build.outputs.image_tag }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Resolve immutable version
      id: version
      run: echo "tag=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - name: Build frontend
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: frontend/Dockerfile
        platforms: linux/amd64
        pull: true
        load: true
        push: false
        provenance: false
        tags: gratilo/frontend:${{ steps.version.outputs.tag }}
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,mode=max,scope=frontend
        # Refresh official Alpine security packages even when the base digest is unchanged.
        no-cache-filters: runtime
        build-args: |
          VITE_PAYMENTS_ENABLED=false
    - name: Scan frontend
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.76.0
        image-ref: gratilo/frontend:${{ steps.version.outputs.tag }}
        scanners: vuln,secret
        format: table
        severity: HIGH,CRITICAL
        exit-code: '1'
        ignore-unfixed: false
        cache-dir: ${{ runner.temp }}/trivy-cache
        timeout: 15m
    - name: Build user-service
      uses: docker/build-push-action@v6
      with:
        context: .
        file: backend/user-service/Dockerfile
        platforms: linux/amd64
        pull: true
        load: true
        push: false
        provenance: false
        tags: gratilo/user-service:${{ steps.version.outputs.tag }}
        cache-from: type=gha,scope=user-service
        cache-to: type=gha,mode=max,scope=user-service
    - name: Scan user-service
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.76.0
        image-ref: gratilo/user-service:${{ steps.version.outputs.tag }}
        scanners: vuln,secret
        format: table
        severity: HIGH,CRITICAL
        exit-code: '1'
        ignore-unfixed: false
        cache-dir: ${{ runner.temp }}/trivy-cache
        timeout: 15m
    - name: Build payment-service
      uses: docker/build-push-action@v6
      with:
        context: .
        file: backend/payment-service/Dockerfile
        platforms: linux/amd64
        pull: true
        load: true
        push: false
        provenance: false
        tags: gratilo/payment-service:${{ steps.version.outputs.tag }}
        cache-from: type=gha,scope=payment-service
        cache-to: type=gha,mode=max,scope=payment-service
    - name: Scan payment-service
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.76.0
        image-ref: gratilo/payment-service:${{ steps.version.outputs.tag }}
        scanners: vuln,secret
        format: table
        severity: HIGH,CRITICAL
        exit-code: '1'
        ignore-unfixed: false
        cache-dir: ${{ runner.temp }}/trivy-cache
        timeout: 15m
    - name: Smoke test shared task with PostgreSQL 15
      env:
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
      run: python3 deployment/scripts/smoke_containers.py
    - name: Save scanned images
      if: inputs.upload_artifacts
      env:
        IMAGE_TAG: ${{ steps.version.outputs.tag }}
      run: |-
        mkdir -p "$RUNNER_TEMP/gratilo-images"
        for service in frontend user-service payment-service; do
          docker save "gratilo/$service:$IMAGE_TAG" -o "$RUNNER_TEMP/gratilo-images/$service.tar"
        done
    - uses: actions/upload-artifact@v4
      if: inputs.upload_artifacts
      with:
        name: scanned-images-${{ steps.version.outputs.tag }}
        path: ${{ runner.temp }}/gratilo-images/*.tar
        retention-days: 7
        compression-level: 0
        if-no-files-found: error
