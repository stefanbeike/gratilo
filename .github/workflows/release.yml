name: Gratilo Release & Deploy Production
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Stable SemVer increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      stripe_test_mode:
        description: 'Enable Stripe test payments only (requires a second confirmation; live keys and Stripe payouts remain blocked)'
        required: true
        type: boolean
        default: false
      new_pricing_enabled:
        description: 'Enable versioned Direct Charges and provisional pool commission (Stripe sandbox only)'
        required: true
        type: boolean
        default: false
      stripe_test_confirmation:
        description: 'When Stripe test mode is enabled, type ENABLE STRIPE TEST PAYMENTS'
        required: false
        type: string
      confirmation:
        description: 'Type RELEASE DEPLOY gratilo-production'
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: gratilo-production-release-deploy
  cancel-in-progress: false
jobs:
  version:
    name: Validate & Version
    uses: ./.github/workflows/006_release_tag.yml
    with:
      version_bump: ${{ inputs.version_bump }}
      confirmation: ${{ inputs.confirmation }}
  ci:
    name: CI & Security
    needs: version
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  images:
    name: Build & Scan
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/005_docker_build.yml
    with:
      upload_artifacts: true
      stripe_test_mode: ${{ inputs.stripe_test_mode }}
      stripe_test_confirmation: ${{ inputs.stripe_test_confirmation }}
  publish:
    name: Publish ECR
    needs: [version, images]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/007_deploy_ecs.yml
    with:
      # Resolve the repository switch outside any environment-scoped job.
      ecr_publish_enabled: ${{ vars.ECR_PUBLISH_ENABLED }}
      image_tag: ${{ needs.images.outputs.image_tag }}
      version_bump: ${{ inputs.version_bump }}
      previous_version: ${{ needs.version.outputs.previous_version }}
      release_version: ${{ needs.version.outputs.version }}
  deploy:
    name: Deploy Production
    needs: [version, images, publish]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/deploy-production.yml
    with:
      version: ${{ needs.version.outputs.version }}
      image_tag: ${{ needs.images.outputs.image_tag }}
      frontend_image: ${{ needs.publish.outputs.frontend_image }}
      user_service_image: ${{ needs.publish.outputs.user_service_image }}
      payment_service_image: ${{ needs.publish.outputs.payment_service_image }}
      stripe_test_mode: ${{ inputs.stripe_test_mode }}
      stripe_test_confirmation: ${{ inputs.stripe_test_confirmation }}
      new_pricing_enabled: ${{ inputs.new_pricing_enabled }}
