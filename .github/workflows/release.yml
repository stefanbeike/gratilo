name: Gratilo Production Release
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'To request production approval, type: DEPLOY gratilo-production'
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: gratilo-production-release
  cancel-in-progress: false
jobs:
  authorize-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
    - name: Require explicit opt-in
      env:
        ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        CONFIRMATION: ${{ inputs.confirmation }}
      run: |
        [[ "$ENABLED" == true ]] || { echo 'Set repository variable PRODUCTION_DEPLOY_ENABLED=true after AWS/GitHub setup.' >&2; exit 1; }
        [[ "$CONFIRMATION" == 'DEPLOY gratilo-production' ]] || { echo 'Explicit deployment confirmation is missing.' >&2; exit 1; }
  ci:
    needs: authorize-request
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  images:
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/005_docker_build.yml
    with:
      upload_artifacts: true
  deploy:
    needs: images
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/007_deploy_ecs.yml
    with:
      image_tag: ${{ needs.images.outputs.image_tag }}
