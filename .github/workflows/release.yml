name: Gratilo ECR Release (payments disabled)
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: gratilo-production-release
  cancel-in-progress: false
jobs:
  version:
    uses: ./.github/workflows/006_release_tag.yml
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  images:
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/005_docker_build.yml
    with:
      upload_artifacts: true
  publish:
    needs: [version, images]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/007_deploy_ecs.yml
    with:
      image_tag: ${{ needs.images.outputs.image_tag }}
      version_bump: tag
      previous_version: ${{ needs.version.outputs.previous_version }}
      release_version: ${{ needs.version.outputs.version }}
