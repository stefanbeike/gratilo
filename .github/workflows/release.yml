name: Gratilo ECR Release (payments disabled)
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: SemVer version increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      confirmation:
        description: 'To request ECR publication approval, type: PUBLISH gratilo-sandbox'
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: gratilo-production-release
  cancel-in-progress: false
jobs:
  authorize-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
    - name: Require explicit opt-in
      env:
        ENABLED: ${{ vars.ECR_PUBLISH_ENABLED }}
        CONFIRMATION: ${{ inputs.confirmation }}
      run: |
        [[ "$ENABLED" == true ]] || { echo 'Set repository variable ECR_PUBLISH_ENABLED=true only after manual AWS/GitHub setup.' >&2; exit 1; }
        [[ "$CONFIRMATION" == 'PUBLISH gratilo-sandbox' ]] || { echo 'Explicit deployment confirmation is missing.' >&2; exit 1; }
  version:
    needs: authorize-request
    permissions:
      contents: read
    uses: ./.github/workflows/006_release_tag.yml
    with:
      version_bump: ${{ inputs.version_bump }}
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  images:
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/005_docker_build.yml
    with:
      upload_artifacts: true
  publish:
    needs: [version, images]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/007_deploy_ecs.yml
    with:
      image_tag: ${{ needs.images.outputs.image_tag }}
      version_bump: ${{ inputs.version_bump }}
      previous_version: ${{ needs.version.outputs.previous_version }}
      release_version: ${{ needs.version.outputs.version }}
