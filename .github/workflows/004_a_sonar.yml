name: SonarCloud
'on':
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      sonar_organization:
        required: true
        type: string
      sonar_project_key:
        required: true
        type: string
    secrets:
      SONAR_HOST_URL:
        required: true
      SONAR_TOKEN:
        required: true
jobs:
  sonar:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - name: Compile backend classes
      run: bash ./gradlew :backend:user-service:classes :backend:payment-service:classes --no-daemon
    - uses: SonarSource/sonarqube-scan-action@v5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: -Dsonar.projectKey=${{ inputs.sonar_project_key }} -Dsonar.organization=${{ inputs.sonar_organization }} -Dsonar.projectName=${{ inputs.project_name }} -Dsonar.sources=backend/user-service/src/main,backend/payment-service/src/main,frontend/src
          -Dsonar.exclusions=**/*.test.tsx,**/*.test.ts -Dsonar.java.binaries=backend/user-service/build/classes/java/main,backend/payment-service/build/classes/java/main -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=600
