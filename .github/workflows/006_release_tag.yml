name: Create Gratilo Release Tag
'on':
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.create-tag.outputs.version }}
permissions:
  contents: write
jobs:
  create-tag:
    name: Create SemVer Tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.VERSION }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fetch all tags
      run: git fetch --tags
    - name: Create Tag
      id: tag
      run: |2

        echo "Selected release type: $RELEASE_TYPE"

        VERSION=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '1p' || true)

        if [ -z "$VERSION" ]; then
          VERSION="v0.1.0"
        else
          BASE=${VERSION#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          if [ "$RELEASE_TYPE" = "major" ]; then
            MAJOR=$((MAJOR+1))
            MINOR=0
            PATCH=0
            echo "MAJOR release triggered"
          elif [ "$RELEASE_TYPE" = "minor" ]; then
            MINOR=$((MINOR+1))
            PATCH=0
            echo "MINOR release triggered"
          else
            PATCH=$((PATCH+1))
            echo "PATCH release triggered"
          fi

          VERSION="v$MAJOR.$MINOR.$PATCH"
        fi

        echo "New version: $VERSION"

        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git tag "$VERSION"
        git push origin "$VERSION"

        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      env:
        RELEASE_TYPE: ${{ inputs.release_type }}
