name: Resolve Gratilo SemVer (read only)
'on':
  workflow_call:
    outputs:
      previous_version:
        value: ${{ jobs.resolve.outputs.previous_version }}
      version:
        value: ${{ jobs.resolve.outputs.version }}
jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      previous_version: ${{ steps.version.outputs.previous_version }}
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Validate stable release tag and main ancestry
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 deployment/scripts/semver_release.py tag-plan
