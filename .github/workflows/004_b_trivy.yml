name: Trivy Security Scan
'on':
  workflow_call:
    secrets: {}
jobs:
  trivy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Trivy FS scan (vulns + secrets)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.76.0
        scan-type: fs
        scan-ref: .
        scanners: vuln,secret
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
        ignore-unfixed: false
        cache-dir: ${{ runner.temp }}/trivy-cache
        timeout: 15m
    - name: Trivy config scan (misconfig)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: v0.76.0
        scan-type: config
        scan-ref: .
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
        cache-dir: ${{ runner.temp }}/trivy-cache
        timeout: 15m
