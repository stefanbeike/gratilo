name: Gratilo Tests and Frontend Build
'on':
  workflow_call: null
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Backend tests and frontend tests/build
      run: bash ./gradlew :backend:user-service:test :backend:payment-service:test :frontend:check :frontend:build --no-daemon
    - name: Registration regression with isolated PostgreSQL 15 and mocked SMTP
      run: python3 deployment/scripts/test_registration_postgres.py
    - name: Payment-link inventory migration and concurrency regression
      run: python3 deployment/scripts/test_pool_link_inventory_postgres.py
    - name: Notification outbox and inbox concurrency regression
      run: python3 deployment/scripts/test_tip_notification_outbox_postgres.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-reports
        path: |-
          backend/**/build/reports/tests/test/
          backend/**/build/test-results/test/
