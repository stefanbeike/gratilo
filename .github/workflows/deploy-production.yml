name: Deploy approved Gratilo release to production
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      image_tag:
        type: string
        default: ''
      frontend_image:
        type: string
        default: ''
      user_service_image:
        type: string
        default: ''
      payment_service_image:
        type: string
        default: ''
      grafana_image:
        type: string
        default: ''
      grafana_retry_only:
        type: boolean
        default: false
      grafana_retry_confirmation:
        type: string
        default: ''
      stripe_test_mode:
        type: boolean
        default: false
      stripe_test_payouts_enabled:
        type: boolean
        default: false
      stripe_test_payout_confirmation:
        type: string
        default: ''
      new_pricing_enabled:
        type: boolean
        default: false
      stripe_test_confirmation:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: gratilo-prd-cluster
      ECS_SERVICE: gratilo-prd-app
      ECS_TASK_FAMILY: gratilo-prd-app
      ECS_TASK_EXECUTION_ROLE_ARN: arn:aws:iam::070351676632:role/gratilo-prd-ecs-execution-role
      ECS_TASK_ROLE_ARN: arn:aws:iam::070351676632:role/gratilo-prd-ecs-task-role
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_BUILD_TAG: ${{ inputs.image_tag }}
      EXPECTED_FRONTEND_IMAGE: ${{ inputs.frontend_image }}
      EXPECTED_USER_SERVICE_IMAGE: ${{ inputs.user_service_image }}
      EXPECTED_PAYMENT_SERVICE_IMAGE: ${{ inputs.payment_service_image }}
      EXPECTED_GRAFANA_IMAGE: ${{ inputs.grafana_image }}
      GRAFANA_RETRY_ONLY: ${{ inputs.grafana_retry_only }}
      GRAFANA_RETRY_CONFIRMATION: ${{ inputs.grafana_retry_confirmation }}
      GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL }}
      GRAFANA_HTTPS_RULE_ARN: ${{ vars.GRAFANA_HTTPS_RULE_ARN }}
      GRAFANA_RDS_HOST: ${{ vars.GRAFANA_RDS_HOST }}
      GRAFANA_PROMETHEUS_URL: ${{ vars.GRAFANA_PROMETHEUS_URL }}
      GRAFANA_LOKI_URL: ${{ vars.GRAFANA_LOKI_URL }}
      GRAFANA_SECRET_ARN: ${{ vars.GRAFANA_SECRET_ARN }}
      OBS_APP_SCRAPE_SECRET_ARN: ${{ vars.OBS_APP_SCRAPE_SECRET_ARN }}
      STRIPE_TEST_MODE: ${{ inputs.stripe_test_mode }}
      STRIPE_TEST_PAYOUTS_ENABLED: ${{ inputs.stripe_test_payouts_enabled }}
      STRIPE_TEST_PAYOUT_CONFIRMATION: ${{ inputs.stripe_test_payout_confirmation }}
      GRATILO_NEW_PRICING_ENABLED: ${{ inputs.new_pricing_enabled }}
      STRIPE_TEST_CONFIRMATION: ${{ inputs.stripe_test_confirmation }}
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '5'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify production environment approval (self-approval allowed)
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 deployment/scripts/production_approval.py
    - name: Validate deployment configuration
      run: |
        python3 deployment/scripts/validate_release_configuration.py production
        python3 deployment/scripts/deploy_grafana.py validate
        if [[ "$GRAFANA_RETRY_ONLY" == true ]]; then
          [[ "$GRAFANA_RETRY_CONFIRMATION" == 'RETRY GRAFANA gratilo-production' ]]
        fi
        python3 -c 'import os,re; assert re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", os.environ["RELEASE_VERSION"])'
    - name: Diagnose OIDC identity (public claims only)
      run: node deployment/scripts/oidc_claims.cjs
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: gratilo-deploy-${{ github.run_id }}
        unset-current-credentials: true
    - name: Verify account and resolve all release images
      run: |
        [[ "$(aws sts get-caller-identity --query Account --output text)" == "$AWS_ACCOUNT_ID" ]]
        python3 deployment/scripts/resolve_release_images.py
    - name: Check Grafana infrastructure before service updates
      run: python3 deployment/scripts/deploy_grafana.py preflight
    - name: Deploy, verify and roll back on failure
      if: ${{ !inputs.grafana_retry_only }}
      run: bash deployment/scripts/deploy_ecs.sh
    - name: Deploy and verify Grafana independently
      run: python3 deployment/scripts/deploy_grafana.py deploy
