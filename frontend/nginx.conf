# TLS terminates at the production load balancer. Preserve its original scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Use the original URI because SPA fallback rewrites $uri before access logging.
map $request_uri $log_payment_request {
    default 1;
    ~^/pay/(success|cancelled)([?]|$) 0;
    ~^/payment-service/tips/checkout/confirm([?]|$) 0;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log combined if=$log_payment_request;
    server_name gratilo.eu localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Internal calls use localhost:8081 directly, never the public proxy.
    location ^~ /user-service/internal/ {
        return 404;
    }

    location ^~ /internal/observability/ {
        return 404;
    }

    location /user-service/ {
        proxy_pass http://${USER_SERVICE_HOST}:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /payment-service/ {
        proxy_pass http://${PAYMENT_SERVICE_HOST}:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
