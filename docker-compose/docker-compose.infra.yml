name: gratilo

services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: gratilo-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - gratilo-network

  postgres:
    image: postgres:15
    container_name: gratilodb
    environment:
      POSTGRES_DB: gratilodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbpass
    ports:
      - "5432:5432"
    networks:
      - gratilo-network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-schemas.sql:/docker-entrypoint-initdb.d/001-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gratilodb"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: gratilo-minio
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - gratilo-network
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: gratilo-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do
        echo 'Waiting for MinIO ...';
        sleep 2;
      done;
      mc mb --ignore-existing local/gratilo;
      mc anonymous set download local/gratilo;
      "
    networks:
      - gratilo-network
    restart: "no"

  # Optional local Stripe test listener. Start with:
  # docker compose -f docker-compose.infra.yml --profile stripe up -d stripe-cli
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: gratilo-stripe-cli
    profiles: ["stripe"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command: listen --events checkout.session.completed,checkout.session.expired,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,payment_intent.succeeded,payment_intent.payment_failed,payment_intent.canceled,charge.refunded,charge.dispute.created,charge.dispute.closed,payout.paid,payout.failed,payout.canceled,account.updated --forward-to http://host.docker.internal:8082/payment-service/webhooks/stripe --forward-connect-to http://host.docker.internal:8082/payment-service/webhooks/stripe-direct
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gratilo-network
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:

networks:
  gratilo-network:
    name: gratilo-network
    external: true
