# Optional WSL or offline build path after running both installDist tasks.
services:
  user-service:
    build: !override
      context: ..
      dockerfile: observability/Dockerfile.backend
      target: installed
      additional_contexts:
        distribution: ../backend/user-service/build/install/user-service
      args: {MAIN_CLASS: com.gratilo.user.Application, SERVICE_PORT: "8081"}
  payment-service:
    build: !override
      context: ..
      dockerfile: observability/Dockerfile.backend
      target: installed
      additional_contexts:
        distribution: ../backend/payment-service/build/install/payment-service
      args: {MAIN_CLASS: com.gratilo.payment.Application, SERVICE_PORT: "8082"}
