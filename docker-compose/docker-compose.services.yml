name: gratilo

services:
  user-service:
    container_name: gratilo-user-service
    build:
      context: ..
      dockerfile: backend/user-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://postgres:5432/gratilodb
      DATASOURCES_DEFAULT_USERNAME: postgres
      DATASOURCES_DEFAULT_PASSWORD: dbpass
      JAVAMAIL_PROPERTIES_MAIL_SMTP_HOST: mailhog
      JAVAMAIL_PROPERTIES_MAIL_SMTP_PORT: 1025
      MAIL_FROM_EMAIL: noreply@gratilo.local
      MAIL_GENERAL_FROM_EMAIL: info@gratilo.local
      MAIL_FROM_NAME: Gratilo
      APP_NAME: Gratilo
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      JWT_SECRET: local-dev-secret-key-please-change-me-1234567890
      INTERNAL_API_KEY: local-internal-secret-change-me
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: gratilo
      FEATURE_TIP_POOLS_ENABLED: ${FEATURE_TIP_POOLS_ENABLED:-false}
      MICRONAUT_ENVIRONMENTS: docker
    ports:
      - "8081:8081"
    networks:
      - gratilo-network
    restart: unless-stopped

  payment-service:
    container_name: gratilo-payment-service
    build:
      context: ..
      dockerfile: backend/payment-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://postgres:5432/gratilodb
      DATASOURCES_DEFAULT_USERNAME: postgres
      DATASOURCES_DEFAULT_PASSWORD: dbpass
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: gratilo
      FEATURE_TIP_POOLS_ENABLED: ${FEATURE_TIP_POOLS_ENABLED:-false}
      MICRONAUT_ENVIRONMENTS: docker
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/pay/success?session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/pay/cancelled}
    ports:
      - "8082:8082"
    networks:
      - gratilo-network
    restart: unless-stopped

  frontend:
    container_name: gratilo-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - gratilo-network
    restart: unless-stopped

networks:
  gratilo-network:
    name: gratilo-network
    external: true
