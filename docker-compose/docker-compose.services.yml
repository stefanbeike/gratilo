name: gratilo

services:
  user-service:
    container_name: gratilo-user-service
    build:
      context: ..
      dockerfile: backend/user-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://postgres:5432/gratilodb
      DATASOURCES_DEFAULT_USERNAME: postgres
      DATASOURCES_DEFAULT_PASSWORD: dbpass
      JAVAMAIL_PROPERTIES_MAIL_SMTP_HOST: mailhog
      JAVAMAIL_PROPERTIES_MAIL_SMTP_PORT: 1025
      MAIL_FROM_EMAIL: noreply@gratilo.local
      MAIL_FROM_NAME: Gratilo
      APP_NAME: Gratilo
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the ignored root .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the ignored root .env}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MICRONAUT_ENVIRONMENTS: docker
      FEATURE_TIP_POOLS_ENABLED: "false"
    ports:
      - "8081:8081"
    networks:
      - gratilo-network
    restart: unless-stopped

  payment-service:
    container_name: gratilo-payment-service
    build:
      context: ..
      dockerfile: backend/payment-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://postgres:5432/gratilodb
      DATASOURCES_DEFAULT_USERNAME: postgres
      DATASOURCES_DEFAULT_PASSWORD: dbpass
      MICRONAUT_ENVIRONMENTS: docker
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the ignored root .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the ignored root .env}
      USER_SERVICE_URL: http://user-service:8081
      FEATURE_TIP_POOLS_ENABLED: "false"
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      STRIPE_SANDBOX_PAYOUTS: "true"
      STRIPE_TEST_ONLY: "true"
      STRIPE_DEMO_ENABLED: "false"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:3000/pay/success?session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:3000/pay/cancelled}
    ports:
      - "8082:8082"
    networks:
      - gratilo-network
    restart: unless-stopped

  frontend:
    container_name: gratilo-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_PAYMENTS_ENABLED: ${VITE_PAYMENTS_ENABLED:-false}
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - gratilo-network
    restart: unless-stopped

networks:
  gratilo-network:
    name: gratilo-network
    external: true
