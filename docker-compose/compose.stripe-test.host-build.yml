# Add only to compose.stripe-test.yml via stripe_test.py up --host-build.
services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.local-runtime
      additional_contexts:
        distribution: ../backend/user-service/build/install/user-service
      args:
        MAIN_CLASS: com.gratilo.user.Application
        SERVICE_PORT: "8081"
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.local-runtime
      additional_contexts:
        distribution: ../backend/payment-service/build/install/payment-service
      args:
        MAIN_CLASS: com.gratilo.payment.Application
        SERVICE_PORT: "8082"
