global:
  scrape_interval: 15s
  scrape_timeout: 8s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/rules.yml
scrape_configs:
  - job_name: prometheus
    file_sd_configs:
      - files: [/etc/prometheus/deployment.json]
  - job_name: backend
    honor_labels: true
    metrics_path: /internal/observability/metrics
    authorization:
      credentials_file: /run/secrets/scrape_token
    sample_limit: 12000
    static_configs:
      - targets: [user-service:8081]
        labels: {service: user-service}
      - targets: [payment-service:8082]
        labels: {service: payment-service}
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http]
    static_configs:
      - targets: ["http://user-service:8081/health", "http://payment-service:8082/health"]
    file_sd_configs:
      - files: [/etc/prometheus/demo-targets.json]
    relabel_configs:
      - source_labels: [synthetic]
        regex: "true"
        action: drop
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: pipeline
    static_configs:
      - targets: [loki:3100, alloy:12345, grafana:3000, blackbox:9115]
  - job_name: demo_traffic
    file_sd_configs:
      - files: [/etc/prometheus/demo-targets.json]
    relabel_configs:
      - source_labels: [synthetic]
        regex: "true"
        action: keep
      - action: labeldrop
        regex: synthetic
