apiVersion: 1
datasources:
  - name: Gratilo · Prometheus
    uid: gratilo-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      manageAlerts: false
      prometheusType: Prometheus
  - name: Gratilo · PostgreSQL (Aggregate)
    uid: gratilo-postgres
    type: postgres
    access: proxy
    url: $OBS_DB_HOST:5432
    user: gratilo_grafana
    editable: false
    jsonData:
      database: $OBS_DB_NAME
      sslmode: disable
      postgresVersion: 1500
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 300
    secureJsonData:
      password: $OBS_DB_PASSWORD
  - name: Gratilo · Loki (bereinigte Ereignisse)
    uid: gratilo-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
